[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narang-rider"
version = "0.1.0"
description = "Fair-pay delivery foundation for riders and local merchants"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/narang_rider"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
