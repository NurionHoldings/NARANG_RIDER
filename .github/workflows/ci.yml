name: CI

on:
  pull_request:
  push:
    branches:
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit contracts and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Whitespace errors
        run: git diff --check

  live-postgres:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: narang_rider_test
          POSTGRES_USER: narang_admin
          POSTGRES_PASSWORD: narang_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U narang_admin -d narang_rider_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NARANG_TEST_POSTGRES_ADMIN_DSN: >-
        postgresql://narang_admin:narang_admin@127.0.0.1:5432/narang_rider_test
      NARANG_TEST_POSTGRES_DSN: >-
        postgresql://narang_app:narang_app@127.0.0.1:5432/narang_rider_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and PostgreSQL test driver
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,postgres]"

      - name: Run migration and live database proofs
        run: pytest -q tests/test_postgres_live.py
