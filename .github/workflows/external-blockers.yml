name: External blocker integrity
on:
  pull_request:
    paths:
      - "config/external-blockers.json"
      - ".github/ISSUE_TEMPLATE/**"
      - "scripts/validate_external_blockers.py"
      - "scripts/external_blocker_snapshot.py"
      - "src/narang_rider/external_readiness.py"
      - "tests/test_external_blockers.py"
  push:
    branches: ["feat/**"]
    paths:
      - "config/external-blockers.json"
      - ".github/ISSUE_TEMPLATE/**"
      - "scripts/validate_external_blockers.py"
      - "scripts/external_blocker_snapshot.py"
      - "src/narang_rider/external_readiness.py"
      - "tests/test_external_blockers.py"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e '.[dev]'\n      - run: python scripts/validate_external_blockers.py
      - run: python -m pytest -q tests/test_external_blockers.py
