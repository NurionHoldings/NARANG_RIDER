name: CI

on:
  pull_request:
  push:
    branches:
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-security:
    name: Offline release security and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned build backend
        run: python -m pip install hatchling==1.27.0
      - name: Local dependency, secret, migration and CSP checks
        run: python scripts/security_check.py
      - name: Build Python package without dependency resolution
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir build/wheels
      - name: Generate SBOM
        run: python scripts/generate_sbom.py
      - name: Verify supply-chain provenance and license policy
        run: python scripts/check_supply_chain.py
      - name: Synthetic backup restore contract
        run: PYTHONPATH=src python -c "from narang_rider.release_security import synthetic_backup_restore as r; assert r({'orders':[{'id':'synthetic-1'}]})['synthetic']"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            build/sbom.cdx.json
            build/supply-chain-provenance.json
            build/wheels/*.whl
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Role portals typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:a11y
      - run: npm run build

  quality:
    name: Unit contracts and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Python compile, source shape and import-cycle contracts
        run: python scripts/check_python_quality.py

      - name: Critical coverage gap inventory
        run: python scripts/check_coverage_gaps.py

      - name: Deterministic OpenAPI contract and compatibility baseline
        run: PYTHONPATH=src python scripts/generate_openapi.py

      - name: Operational handoff reference freshness
        run: PYTHONPATH=src python scripts/verify_handoff_refs.py

      - name: Synthetic migration and recovery safety drill
        run: PYTHONPATH=src python scripts/run_migration_recovery_drill.py

      - name: Tests
        run: pytest -q

      - name: Upload OpenAPI contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: |
            api/openapi.json
            api/openapi.sha256
            frontend/src/openapi-contract.ts
            build/migration-recovery-drill.json
            build/migration-recovery-drill.json.sha256

      - name: Deterministic model invariant smoke seeds
        run: python tests/model_harness.py --profile smoke

      - name: Bounded synthetic load and abuse simulation
        run: python scripts/run_synthetic_simulation.py --profile smoke > synthetic-simulation-report.json

      - name: Partner sandbox contracts (generic and provisional profiles)
        run: |-
          PYTHONPATH=src python scripts/certify_partner_sandbox.py --profile generic-platform > partner-generic.json
          PYTHONPATH=src python scripts/certify_partner_sandbox.py --profile ai-baebi > partner-ai-baebi.json
          PYTHONPATH=src python scripts/certify_partner_sandbox.py --profile dosirak-store > partner-dosirak-store.json

      - name: Whitespace errors
        run: git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-simulation-report
          path: |
            synthetic-simulation-report.json
            build/model-invariant-report.json
          retention-days: 14

  live-postgres:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: narang_rider_test
          POSTGRES_USER: narang_admin
          POSTGRES_PASSWORD: narang_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U narang_admin -d narang_rider_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NARANG_TEST_POSTGRES_ADMIN_DSN: >-
        postgresql://narang_admin:narang_admin@127.0.0.1:5432/narang_rider_test
      NARANG_TEST_POSTGRES_DSN: >-
        postgresql://narang_app:narang_app@127.0.0.1:5432/narang_rider_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and PostgreSQL test driver
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,postgres]"

      - name: Run migration and live database proofs
        run: pytest -q tests/test_postgres_live.py

  local-full-stack:
    name: Synthetic local full stack
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Static local-stack threat checks
        run: python scripts/check_local_stack_threats.py
      - name: Build and start isolated stack
        run: docker compose -f compose.local.yml up --build --wait
      - name: Deterministic end-to-end smoke
        run: |-
          docker compose -f compose.local.yml exec -T app python scripts/local_full_stack_smoke.py --base-url http://127.0.0.1:8000 --output /tmp/local-full-stack-report.json | tee local-full-stack-report.json
      - name: Collect redacted synthetic logs
        if: always()
        run: docker compose -f compose.local.yml logs --no-color --no-log-prefix | sed -E 's/(authorization|cookie|token)=[^ ]+/\\1=[REDACTED]/Ig' > local-stack.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-full-stack-evidence
          path: |
            local-full-stack-report.json
            local-stack.log
          if-no-files-found: warn
          retention-days: 7
      - name: Clean teardown
        if: always()
        run: docker compose -f compose.local.yml down --volumes --remove-orphans
